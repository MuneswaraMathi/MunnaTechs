<html>
    <head>
        <title>tables</title>
        <style>
            table {
                margin: 30px;
            }
            table,tr,td,th {
                border: 2px solid maroon;
                border-collapse: collapse;
                padding: 10px;
            }

        </style>
    </head>
    <body>
        <table >
            <tr>
                <th>Name</th>
                <th colspan="2">Age & City</th>
            </tr>

            <tr>
                <td>John Doe</td>
                <td>30</td>
                <td>New York</td>
            </tr>
            <tr>
                <td>Jane Smith</td>
                <td rowspan="2">25</td>
                <td>Los Angeles</td>
            </tr>
            <tr>
                <td>Emily Johnson</td>
                <td>Chicago</td>
            </tr>
        </table>
</html>
