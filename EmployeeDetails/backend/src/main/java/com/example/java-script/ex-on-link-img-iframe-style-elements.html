<html>
    <head>
        <title>img,link and iframe elements</title>
        <style>
            h1,h2,a{
                color: navy;
            }
        
        </style>
    </head>
    <body>
        <h1>img,link and iframe elements</h1>
        <h2>Image Element</h2>
        <img src="https://www.w3schools.com/html/pic_trulli.jpg" alt="Trulli" width="500" height="333">

        <h2>Iframe Element</h2>
        <iframe name="youtube_iframe" src="https://www.youtube.com/embed/dQw4w9WgXcQ" width="560" height="315" title="YouTube video player" frameborder="0"></iframe>

         <h2>Link Element</h2>
        <a href="https://www.google.com" target="youtube_iframe">Google</a>
    </body>
</html>
