spring.datasource.url=jdbc:postgresql://localhost:5432/villageDevelopment
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=potumeraka
spring.datasource.password=potumeraka
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
jwt.secret=MyJwtSecretKey123456789012345678901234567890
server.port=8080
server.servlet.context-path=/village/potumeraka

# Logging Configuration
logging.level.root=INFO
logging.level.com.example=DEBUG
logging.level.com.example.auth=DEBUG
logging.level.com.example.contributions=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Log file configuration (optional)
logging.file.name=logs/application.log
logging.file.max-size=10MB
logging.file.max-history=10

# Console logging pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
