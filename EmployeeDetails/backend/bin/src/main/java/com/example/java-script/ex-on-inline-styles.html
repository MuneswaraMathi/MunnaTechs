
<html>
    <head>
        <title>inline styles</title>
    </head>
    <body>
        <!-- inline styles should be applied at each element using style attribute-->
         <!--style should be applied in the starting tag of each element-->
        <h1 style="color:red;">Inline Styles</h1>
        <p style="background-color:yellow;color:red;font: size 40px;">Welcome to inline styles</p>
    </body>
    
</html>
