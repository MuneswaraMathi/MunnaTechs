<html>
    <head>
        <title>internal styles</title>
        <style>
            p {
                color: blue;
                font-size: 20px;
            }

            #p1 {
                color: green;
                font-weight: bold;
            }

            .paragraphc {
                background-color: lightgray;
                color: maroon;
            
            }
            h1{
                color: red;
                font-size: 20px;
            }
        </style>
    </head>
    <body>
        <h1>Internal Styles</h1>
        <p>internal styles for the element paragraph..</p>
        <p id="p1">paragraph element with Id attribute</p>

        <p id="p2" class="paragraphc">paragraph element with id and class attributes..</p>
        <p id="p3" class="paragraphc">paragraph with id and class attribute..</p>

    </body>
</html>
